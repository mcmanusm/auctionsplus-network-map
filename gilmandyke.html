s":"WA","lat":-31.6944,"lng":115.8453,"v":1,"b":0,"by":0},{"a":"128361","y":"2026","t":"Pemberton","s":"WA","lat":-34.4387,"lng":115.8606,"v":1,"b":0,"by":0},{"a":"128361","y":"2026","t":"Yabberup","s":"WA","lat":-33.5649,"lng":115.9239,"v":1,"b":0,"by":0}];
const META = {
  v:{title:"Catalogue Viewer Locations", lab:"Unique Viewers", noun:"viewers"},
  b:{title:"Bidder Locations",           lab:"Bidders",        noun:"bidders"},
  by:{title:"Buyer Locations",           lab:"Buyers",         noun:"buyers"}
};
// State palette — Mortlake scheme
const SC = {
  VIC:{c:"#2E7DB4",n:"Victoria"}, NSW:{c:"#E36B2C",n:"New South Wales"},
  SA:{c:"#B0399A",n:"South Australia"}, QLD:{c:"#43A047",n:"Queensland"},
  TAS:{c:"#00B0D6",n:"Tasmania"}, WA:{c:"#6A4CA0",n:"Western Australia"},
  NT:{c:"#F2B705",n:"Northern Territory"}, ACT:{c:"#F2B705",n:"ACT"}
};
const SORDER = ["VIC","NSW","SA","QLD","TAS","WA","NT","ACT"];
let metric="v", year="all";

const map=L.map('map',{zoomControl:true,attributionControl:true,zoomSnap:.25,zoomDelta:.5}).setView([-28.4,134.5],4.2);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?key=cb1_268j_1_fb85caa52eb78ead893a0db1',{
  attribution:'&copy; OpenStreetMap &copy; CARTO', subdomains:'abcd', maxZoom:19
}).addTo(map);
const layer=L.layerGroup().addTo(map);

function agg(){
  const m={};
  for(const d of DATA){
    if(year!=="all" && d.y!==year) continue;
    const k=d.t+"|"+d.s;
    if(!m[k]) m[k]={t:d.t,s:d.s,lat:d.lat,lng:d.lng,v:0,b:0,by:0};
    m[k].v+=d.v; m[k].b+=d.b; m[k].by+=d.by;
  }
  return Object.values(m);
}
function radius(n){ return n<=0?0 : 3+2.2*Math.sqrt(n); }

function render(){
  layer.clearLayers();
  const mt=META[metric], rows=agg();
  let total=0; const towns=new Set(), byState={}; let top=null;
  rows.filter(r=>r[metric]>0).sort((a,b)=>b[metric]-a[metric]).forEach(r=>{
    const n=r[metric], col=(SC[r.s]||{c:"#888"}).c;
    total+=n; towns.add(r.t+"|"+r.s);
    if(!byState[r.s]) byState[r.s]={n:0,towns:new Set()};
    byState[r.s].n+=n; byState[r.s].towns.add(r.t);
    if(!top || n>top.n) top={t:r.t,s:r.s,n:n};
    L.circleMarker([r.lat,r.lng],{radius:radius(n),color:col,weight:1,fillColor:col,fillOpacity:.62})
     .bindPopup('<div class="pc-town">'+r.t+'</div><div class="pc-state">'+(SC[r.s]?SC[r.s].n:r.s)+'</div>'+
       '<div class="pc-row"><span class="k">Viewers</span><span class="val">'+r.v+'</span></div>'+
       '<div class="pc-row"><span class="k">Bidders</span><span class="val">'+r.b+'</span></div>'+
       '<div class="pc-row"><span class="k">Buyers</span><span class="val">'+r.by+'</span></div>')
     .addTo(layer);
  });
  // header + left stats
  document.getElementById('ttl').textContent=mt.title;
  document.getElementById('rch').innerHTML='<b>'+total.toLocaleString()+'</b> '+mt.noun+' across '+towns.size.toLocaleString()+' towns';
  document.getElementById('s-total').textContent=total.toLocaleString();
  document.getElementById('s-total-lab').textContent=mt.lab;
  document.getElementById('s-total-sub').textContent=(year==="all"?"All sales combined":year+" sale");
  document.getElementById('s-towns').textContent=towns.size.toLocaleString();
  document.getElementById('s-states').textContent=Object.keys(byState).length;
  document.getElementById('s-top').textContent=top?top.t:"—";
  document.getElementById('s-top-sub').textContent=top?(top.s+" — "+top.n+" "+mt.noun):"";
  // right per-state cards
  const sc=document.getElementById('statecards'); sc.innerHTML="";
  SORDER.filter(s=>byState[s]).sort((a,b)=>byState[b].n-byState[a].n).forEach(s=>{
    const d=byState[s], pc=total?Math.round(100*d.n/total):0;
    sc.insertAdjacentHTML('beforeend',
      '<div class="scard" style="margin-bottom:8px">'+
      '<div class="top" style="background:'+SC[s].c+'">'+SC[s].n+'<span class="pc">'+pc+'%</span></div>'+
      '<div class="grid"><div class="cell"><div class="n">'+d.n.toLocaleString()+'</div><div class="t">'+mt.lab+'</div></div>'+
      '<div class="cell"><div class="n">'+d.towns.size+'</div><div class="t">Towns</div></div></div></div>');
  });
}
// legend (dedup NT/ACT)
(function(){const seen=new Set();document.getElementById('legend').innerHTML=SORDER.map(s=>{
  const nm=(s==="NT"||s==="ACT")?"NT / ACT":SC[s].n; if(seen.has(nm))return""; seen.add(nm);
  return '<div class="it"><span class="sw" style="background:'+SC[s].c+'"></span>'+nm+'</div>';
}).join('');})();

document.querySelectorAll('.pill.metric').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.pill.metric').forEach(x=>x.classList.remove('active'));b.classList.add('active');metric=b.dataset.metric;render();});
document.querySelectorAll('.pill.year').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.pill.year').forEach(x=>x.classList.remove('active'));b.classList.add('active');year=b.dataset.year;render();});
render();
</script>
